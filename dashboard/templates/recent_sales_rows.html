{% for sale in sales %}
<tr>
  <td>INV-{{sale.invoice_no }}</td>
  <td>{{ sale.buyer_name }}</td>
  {% comment %} <td>{{ sale.subtotal }}</td> {% endcomment %}
  <td>{{ sale.grand_total }}</td>
  <td>{{ sale.payment_status }}</td>
  <td>{{ sale.sale_date|date:"Y-m-d H:i" }}</td>
</tr>
{% empty %}
<tr><td colspan="6" class="dash-table-empty">No recent sales.</td></tr>
{% endfor %}
