<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h3>{{ title }}</h3>
            <form method="post" class="card card-body shadow-sm">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Fiscal Year Name</label>
                    {{ form.name }}
                    {{ form.name.errors }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Start Date (BS)</label>
                    {{ form.start_date_bs }}
                    {{ form.start_date_bs.errors }}
                </div>
                <div class="mb-3">
                    <label class="form-label">End Date (BS)</label>
                    {{ form.end_date_bs }}
                    {{ form.end_date_bs.errors }}
                </div>
                <div class="form-check mb-3">
                    {{ form.is_active }}
                    <label class="form-check-label">Set as Active Fiscal Year</label>
                </div>
                <div class="form-check mb-3">
                    {{ form.is_closed }}
                    <label class="form-check-label">Mark as Closed Period</label>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{% url 'fiscal_year_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Fiscal Year</button>
                </div>
            </form>
        </div>
    </div>
<body>
