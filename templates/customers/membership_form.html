{% extends 'base.html' %}
{% block content %}
<main>
    <h1>Register Membership — {{ customer.customer_name }}</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'customer_profile' customer.pk %}" class="btn btn-secondary">Cancel</a>
    </form>
</main>
{% endblock %}
