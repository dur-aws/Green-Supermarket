{% load static %}


<link rel="stylesheet" href="{% static 'css/master.css' %}" />

    {% for uom in uoms %}
    <tr>
      <td class="mono">{{ uom.uom_id }}</td>
      <td class="unit-name">{{ uom.unit_name }}</td>
      <td class="notaion">{{ uom.notation }}</td>
      <td>{{ uom.is_weight_based }}</td>
      <td>  {% if uom.is_active %}
        active
    {% else %}
        desabled
    {% endif %}</td>
    
      <td class="actions">
        <div class="actions-inner">
          <a
            href="{% url 'uom_edit' uom.uom_id %}"
            class="icon-btn icon-edit"
            title="Edit"
            >&#9998;</a
          >
          <form method="post" action="{% url 'uom_status' uom.uom_id %}" style="display: inline;" onsubmit="return confirm('Change status for {{ uom.unit_name|escapejs }}?');">
            {% csrf_token %}
            <button type="submit" class="action-link deactivate">Change status</button>
          </form>
        </div>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="11" class="empty-row">No units found.</td>
    </tr>
    {% endfor %}
  </body>
</html>
