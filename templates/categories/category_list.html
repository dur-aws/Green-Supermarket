{% extends "base.html" %}
{% load static %}
{% block content %}

    <link rel="stylesheet" href="{% static 'css/master.css' %}" />

    <div class="container">
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="search-box">
                <span class="search-icon">&#128269;</span>
                <input
                    type="text"
                    id="category-search"
                    placeholder="Search by category name..."
                    value="{{ query|default:'' }}"
                    class="search-input"
                    autocomplete="off"
                />
            </div>
            <div class="filter-right">
                <a href="{% url 'category_add' %}" class="btn btn-primary btn-add">+ Add Category</a>
                <a href="#" class="btn btn-export">&#8595; Export</a>
            </div>
        </div>

        <!-- Summary Stat Strip -->
        <div class="stat-strip">
            <div class="stat-item">
                <span class="stat-label">Total Categories
                <strong id="showing-count">{{ categories|length }}</strong>
            </div>
        </div>

        <div class="table-card">
            <div class="table-responsive">
                <table class="data-table styled-table">
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>category name</th>
                            <th>parent</th>
                            <th>expiry tracking</th>
                            <th>batch tracking</th>
                            <th>catch weight</th>
                            <th>actions</th>
                        </tr>
                    </thead>
                    <tbody id="category-table-body">
                        {% include 'categories/category_rows.html' %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("category-search");
        const showingCountEl = document.getElementById("showing-count");
        const tableBody = document.getElementById("category-table-body");

        let debounceTimer = null;
        const searchApiUrl = "{% url 'category_search' %}";

        function runSearch() {
            const params = new URLSearchParams();
            if (searchInput.value.trim()) {
                params.set('q', searchInput.value.trim());
            }

            fetch(searchApiUrl + '?' + params.toString(), {
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(function (res) {
                return res.json();
            })
            .then(function (data) {
                tableBody.innerHTML = data.rows_html;
                showingCountEl.textContent = data.showing_count;
            })
            .catch(function (error) {
                console.error("AJAX Search Error:", error);
            });
        }

        searchInput.addEventListener("input", function () {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(runSearch, 250);
        });
    });
    </script>

{% endblock %}
